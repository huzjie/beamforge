# beamforge default config
backend:
  name: mock
  model: beamforge-mock
  api_key: ""
  base_url: ""
  temperature: 0.7
  max_tokens: 256

moe:
  n_experts: 32
  top_k: 2
  dim: 64
  hidden: 64
  capacity_factor: 1.25
  aux_loss_coef: 0.01

fault:
  inject: false
  n_faults: 71
  mttr_target_minutes: 8.0
  checkpoint_every: 50
  elastic: true

sandbox:
  n_sandboxes: 64
  kinds:
    - code
    - web
    - agent
  max_concurrency: 16

train:
  epochs: 3
  lr: 0.1
  batch_size: 16
